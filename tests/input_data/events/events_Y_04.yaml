- operator: comment
  time: 2024-12-22
  eventBegin: 2024-12-21 11:21:00 GPS
  eventEnd: 2024-12-23 13:11:00 GPS
  createdby: ellmer
  text: |
    this is a freeform indented verbatim text where I can write
    whatever I want and newlines, indentation, and formatting is
    preserved
     * at least as far as I understand it?
     * you can do what you want here
     * the formatting of a file like this is a bit more verbose
       than the current operator files, but by defining a grammar
       of the types of events we allow and automatically validating
       that shouldn't be too too bad.
    Thinking about it more, maybe instead of having one file with all
    info, have two:
      * One auto-generated, SOE type entries from automated processes
      * One with manual edits and comments by operators
    Then, these two would be automatically interleaved and published
    to mango or elsewhere on commit.
