  createdby: ''
  data: "           and 2024-01-22 I did look at that one huge grace-D along-track\
    \ overlap (18 mm rms!) on 2024-01-22:  it was indeed a missed cycle slip, and\
    \ can be eradicated by adding a phase break the grace-D data for GPS53 at 2024-01-21\
    \ 23:49:10 GPS on both days (21st and 22nd).   My re-run directories are /home/mamiller/GraceFo/rl04/D_2024-01-21_try1\
    \ and /home/mamiller/GraceFo/rl04/D_2024-01-22_try1 if you want to look (all I\
    \ did was add the break for GPS53 at the one epoch).\nFor the rest of the kband\
    \ residual blips:   I talked to Willy last week, and we agreed that instead of\
    \ chasing down all of the missed breaks individually by hand, it would be better\
    \ to continue the effort on the high-iono editor itself.   I’ll talk to Willy\
    \ some more this morning and make sure we are all agreed.\nBTW, I noticed that\
    \ we dropped from the usual 12 channels to 7 channels of L1/L2 data for 3 of the\
    \ days last week (which I assume was the cause of the IPU reboot on the 23rd).\
    \   See plot below (cc’ing Jeff). - Mark\n           Inserted a phase break for\
    \ GPS53 at 2024-01-21 23:49:10 for GF2 GPS data on both days. - mpaik \nA small\
    \ time gap on 2024-02-05, 2024-02-08, and 2024-02-16:\nAndreas Pohl confirmed\
    \ two incidents:\n"
