  createdby: ''
  data: "           The inter-satellite measurements (KBR, LRI) are interrupted.\n\
    \           GRACE-C The On-Board Time suddenly changed to an epoch in the future\
    \ (as on GF2 on day 18) - this time about 3 days ahead.\n                   Thus\
    \ the satellite dropped to Safe Mode and OBCP-14 was triggered resulting in the\
    \ cleaning of the MTL and switching all\n                   instruments (except\
    \ USO and ACC) off (10:35). IPU, MWA, LRI and STR are switched off.\n        \
    \           At 12:30 the O/B time was reset from ground and the MTL was re-enabled.\
    \ At 14:05 dumps were successfully performed over\n                   the time\
    \ jump and the MTL was re-loaded. The delete pointer management is still disabled\n\
    \           GRACE-D AOCS pointing was changed to nadir pointing at 12:30 to account\
    \ for the missing inter-satellite measurements. \n                   The IPU was\
    \ restarted at 13:20 with disabled K/Ka trackers (over Antarctica/Ross Ice Shelf).\n\
    \                   GPS1A bad data in channel 1 and 2 starting from 2020-02-05\
    \ 16:52:40 until 2020-02-07 13:25:00. This data has been excluded in orbit processing.\
    \ - mpaik\n"
  spacecraft: C
