  data: "           GRACE-D ACC relay test: At 16:25 the ACC relay was opened for\
    \ 3 minutes while the thrusters were disabled for 15 minutes (16:19-16:34). \n\
    \           GF2 was commanded to NOM-AH (14:35-18:24) and event/action of OBCP14\
    \ (AOCS ASM Setup) was disabled. For comparison, before and after the relay test\
    \ thrusters were disabled for 15 minutes while the relay remains closed (14:45-15:00,\
    \ 17:54-18:09). -tamarab\n"
  spacecraft: C
- spacecraft_event: comment
  time: '2019-11-19 00:00:00'
  gps_time: 627393600.0
  created: ''
  createdby: ''
  data: "           GRACE-D The ACC relay test was continued - the thrusters were\
    \ disabled for 15 minutes (12:41-12:56) interrupted by a single +roll/-roll thrust\
    \ firing (12:48) during the 3 minutes with relay open (12:46-12:49). GF2 was in\
    \ NOM-AH (12:31-13:11) and event/action of OBCP14 (AOCS ASM Setup) was disabled.\
    \ Another test was performed in the afternoon - the thrusters were disabled from\
    \ 16:11 to 16:17 and the ACC relay opened from from 16:13 to 16:16. During that\
    \ time a single +yaw/-yaw thrust firings (16:15:00 and 16:15:15 ) were commanded.\
    \ GF2 was in NOM-AH from 16:10 to 16:32. Event/action of OBCP14 (AOCS ASM Setup)\
    \ was disabled yesterday at 16:10 and was enabled today at 07:44. \n         \
    \  LRI dropped to Re-Acquisition Mode at 12:52 - tamarab\n"
  spacecraft: C
