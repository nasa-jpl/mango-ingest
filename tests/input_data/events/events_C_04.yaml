               Both C and D are affected by sun blinding for the LRI. We have a number of cycle slips and a loss of lock which is why there is a gap in data. - Sam
               There is a loss of lock so we’ll need to break the scale and time bias estimates that we make at Level-1 into two batches. I’ve done this by adding an LRI_DATATION entry for GRACE-C in the SOE file (during the GRACE-C data gap). The loss of lock caused a jump in the range data which caused the scale factor and time bias estimation to go awry. With the break it should estimate one set of values for before and after the bias jump. - cmccullo
               Deleted bad data due to sun-blinding from 03:22:00 through 03:22:20 in LRI1A pass files for C and D. - mpaik
