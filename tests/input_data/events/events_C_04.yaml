  gps_time: 602683200.0
  created: ''
  createdby: ''
  data: "           GRACE-C and D accelerometer thruster pulse plateau characterization\
    \ - manual commanding of the attitude control\n           thrusters (ACT) was\
    \ performed. First an alternating sequence of 24 1s long actuations of +pitch/-pitch\
    \ ACTs.\n           Then an alternating sequence of 24 1s long actuations of -yaw/+yaw\
    \ ACTs. During the thruster firing LRI was commanded to standby mode and was collecting\
    \ high rate data.\n           GRACE-C: The thrust manual commanding sequence was\
    \ performed from 16:39 through 16:42 at a realtime contact (NSG). \n         \
    \  GRACE-D: The thrust manual commanding sequence was performed from 15:04 through\
    \ 15:07 at a realtime contact (NSG). \n"
  spacecraft: C
- spacecraft_event: comment
  time: '2019-02-07 00:00:00'
  gps_time: 602769600.0
  created: ''
  createdby: ''
  data: "           GRACE-D at 08:27 OBC-A rebooted after a communication problem.\
    \ \n           As this reboot did not cure the problem the switch-over to OBC-B\
    \ was triggered at 08:32.\n           This caused all instruments and the star\
    \ camera equipment powered off, and S/C was in Attitude Hold Mode with nadir pointing.\n\
    \           This also caused cold gas branch A (CGPS-A) and transmitter A (TX-A)\
    \ turned off, and \n           mass memory MMU-B was in use and the mission timeline\
    \ (MTL) was disabled, which stopped the downlinks over Ny-Alesund. \n        \
    \   At 14:42 the MTL was re-enabled and re-loaded and CGPS-A was enabled again.\
    \ \n           At the end of the contact TX-B was switched off - so that TX-A\
    \ will be used again for all upcoming downlinks.\n           Some manual re-dumps\
    \ of the inactive MMU-A were commanded successfully, and the s/c is in a safe\
    \ state. - byun\n           GRACE-D turned off (2018-02-07 status report) - hywen\n"
  spacecraft: C
