- spacecraft_event: comment
  time: '2019-09-03 00:00:00'
  gps_time: 620740800.0
  created: ''
  createdby: ''
  data: "           GRACE-C Frequent 3-second gaps in THR1A data for the duration\
    \ of thruster plateau test, which started on 13:02 and will be finished at 2019-09-10\
    \ 15:05 - hywen, from ops status reports\n           Email from Lukas Hoffman\
    \ <L.Hoffmann@dlr.de> on 2019-09-09: \n           \"The 3-second gaps are expected\
    \ and related to the design of our thruster test procedure.\n           The procedure\
    \ was originally created for the thruster test in March and includes an increasing\
    \ of additional thruster telemetry (SPID14001) from 1/6 Hz to 1 Hz before the\
    \ execution of the thrust and a reset to 1/6 Hz after the thrust.\n          \
    \ During the telemetry rate change, the telemetry packet generation is disabled\
    \ for two seconds before being enabled again with a new rate. Since the telemetry\
    \ rate is currently set to 1 Hz by default, we changed the reset rate after the\
    \ thrust from 1/6 Hz to 1Hz. This was the only way to re-use the validated procedure\
    \ quickly without additional modifications. Unfortunately, as you noticed, this\
    \ results in some \"lost\" samples between the thrusts.\"\n"
  spacecraft: C
