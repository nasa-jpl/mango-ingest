  created: ''
  createdby: ''
  data: |2
               Based on carrier-to-noise density ration observation(C/NO) of IGS receivers, global flex power operation was observed on 2019-06-20 and 2019-06-21. Flex power started subsequently for all healthy Block IIR-M and IIF satellites on June 20 between 15:18 and 17:49 UTC. C/N0 of the P(Y)-code tracking increased by roughly 10 dB for all healthy Block IIR-M and IIF satellites whereas C/N0 of the C/A-code decreased by about 2-3 dB for the healthy IIR-M satellites only. The changes in power levels are similar to flex power mode III discussed in "Steigenberger P, Thölert S, Montenbruck O. (2019) Flex power on GPS Block IIR-M and IIF, GPS Solutions, doi:10.1007/s10291-018-0797-8". All satellites returned to normal power levels on June 21 between 6:00 and 10:00 UTC.
               The above flex power degraded Grace-FO orbit performance to a few millimeter level. - byun
               142-second gap in GNV1A on GRACE-C was caused by IPU tracking fewer than 4 Satellites during that interval (142 seconds).
               Since the gap did not exceed the IPU internal no Nav Solution timeout of 240 seconds, it did not trigger a reboot. - mpaik
  spacecraft: C
