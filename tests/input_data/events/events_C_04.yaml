               Combined IMU1A_C encountered an error due to a time gap of 7200.125905 sec between 757866220.878026 and 757873421.003931. However, telemery files fully cover this period without any gap. It appears that IMU1A_2024-01-07_C_NSG_757861961.pass has a big time gap from 757866220.875775 till 757895681.003931 lasting for 29460.128156 sec. After this gap, the file contains duplicated data present in other files. As a result, CombineLevel1 did not properly assort the data, making this an abnormal case. Instead of modifying the code, the duplicated data in IMU1A_2024-01-07_C_NSG_757861961.pass from 757895681.003931 through 757907020.878026 (end) were deleted to address this issue. -mpaik
