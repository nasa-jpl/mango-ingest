- problem_files: comment
  time: '2024-03-17 00:00:00'
  gps_time: 763905600.0
  created: ''
  createdby: ''
  data: "           This particular kband-POD residual spike was not due to an editing\
    \ problem.   This one is a “bad channel” arc, but with characteristics I’ve never\
    \ seen before.  \n           For ops: if you delete the data for GPS66 from 763946200\
    \ through 763950550 of GF1, then the kband-POD residuals look fine.\n        \
    \   The strange thing about this “bad channel” is that the SNRs look fine.   The\
    \ only telltale sign of problems:   the iono-free range residuals in the POD are\
    \ biased at around 16 meters.   Of course, the POD tosses all of that range data,\
    \ but the POD phase residuals for that GPS66 arc actually look OK (and coverage\
    \ is fairly good:  6 PRN or more).   However, nuking the phase data for that arc\
    \ results in kband-POD residuals that look normal. \n           It is hard to\
    \ see what is wrong with the phase data:    I could try keeping the data in the\
    \ POD but deweighting it so we could see better the characteristics of it’s errors,\
    \ if folks are interested in spending time following up on this.   - mark\n"
  spacecraft: C
