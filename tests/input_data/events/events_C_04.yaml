               There were abnormally high KBR-GPS range stats for this date and problems with clock overlap statistics. Various stats clearly pointed to GRACED for 2022-11-27. Mark, re-ran, on the 335 cluster, and got distinctly different edits and good kbr-gps. Operational results about 10.7 mm, Mark’s run: 1.6 mm. Willy has placed this run on the PODAC cluster: /fosds/work/od_working/rl04/D_2022-11-27_try2. Willy also re-ran the case on the 335 cluster with a slightly older version of the software, and reproduced the operational results (poor run), re-compiled with the version Mark used and got good results. It will take a bit to hunt down what we think is a subtle bug in the data editing. To deliver in a timely fashion, POD was replaced by "ln -s /fosds/work/od_working/rl04/D_2022-11-27_try2 /fosds/work/od_working/rl04/D_2022-11-27" - mpaik
