               The reacquisition at the end of the low Carrier-to-Noise-Ratio (CNR) test (performed last week) happened before the differential wavefront sensing pointing offset had been restored to 0. A reacquisition of the LRI was commanded at 20:37. This restored gain as well as in-phase and quadrature-phase amplitude values back to nominal resulting in ~110s gaps in LRI1A data of both spacecraft. - mpaik
               The contents of the On-Board Control Procedures (OBCPs) onboard the satellites were downlinked (GF2 20:58 and GF1 22:34). The contents and CRCs in both RAM and EEPROM match expectations. This activity satisfies the precondition for next week's OBCP update.
