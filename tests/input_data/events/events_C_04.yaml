  data: |2
               Orbit raise maneuvers were performed on both satellites. - mpaik
               At 00:30 the IPUs were restarted with K/Ka trackers disabled.
               00:34 the LRIs were commanded to Diagnostic Mode
               Orbits of both satellites were raised by ca. 960m.
               At 16:15 the IPUs were restarted to Normal Mode with K/Ka trackers enabled and KBR measurement were resumed.
               At 16:17 the LRIs were commanded to Re-acquisition Mode and entered Science Mode shortly thereafter.
               GRACE-C At 00:40 a yaw turn-around maneuver was performed (in NOM-ACQ)
                       At 01:15:05 the 1st orbit raise maneuver was performed in OCM: duration= 29min50sec, dV=0.2654 m/s
                       At 05:00:05 the 2nd orbit raise maneuver was performed in OCM: duration= 29min50sec, dV=0.2655 m/s
                       At 14:00 a yaw turn-around maneuver was performed (in NOM-ACQ)
                       IPU reboot (commanded) at 16:20:10
               GRACE-D At 01:15:10 the 1st orbit raise maneuver was performed in OCM: duration= 29min40sec, dV=0.2635 m/s
                       At 05:00:10 the 2nd orbit raise maneuver was performed in OCM: duration= 29min40sec, dV=0.2637 m/s
                       At 16:03:45 an orbit correction maneuver was performed in OCM: duration= 29sec, dV=0.4237 cm/s
                       IPU reboot (commanded) at 16:20:10
  spacecraft: C
