- problem_files: comment
  time: '2020-01-09 00:00:00'
  gps_time: 631800000.0
  created: ''
  createdby: ''
  data: |2
               The LRI experienced anomalous behavior during blinding events that necessitated special handling of the LRI processing. This is fully outlined below:
               Editing of the LRI1A for GF2:
                   Data before the gaps induced by sun blinding had to be edited further to avoid corrupted data. Note that these spans are probably over-edited.
                   Remove data points from the following times (inclusive):
                       663459515.027797392 - 663459525.271792807
                   Note that after the break (due to the sun blinding, the extra editing above, and the anomalous data), qualflag 0 must be set to 1, in order to indicate that the gap should not be filled. Currently, if the gap is 21 seonds or longer, this is done automatically by LRI_debreak. In this case the gaps are longer than 21 seconds so no extra action is needed. In the future, if the gaps were smaller the option -maxgap (to LRI_debreak) could be used to set the qualflag 0 to 1.
                   After the manual editing is complete, the initial steps of the LRI chain need to be run manually. The script /fosds/work/L1B/rl00/2021/2021-01-09/LRI1B/test/process_LRI_1.sh does this for the rl00 data. For rl04 processing, this script can be copied and modified as necessary.
                   Additionally there is currently a bug in the LRI chain that does NOT propagate the setting of qualflag 0 to 1 all the way through the LRI process to the second run of LRI_order (see the wiki - Notes for operators - for details on the LRI processing chain). Due to this, manual edits have to be made in the LRI1A_2021-01-09_D_00.dat.dbk.jmp.llkOrd file. These are outlined below:
                   Edited need on the LRI1A_2021-01-09_D_00.dat.dbk.jmp.llkOrd file:
                       Change qualflag 0 to 1 (example: 00000000 -> 00000001) for the following times (these are just after the gap (due to sun blinding and extra editing of the LRI1A file):
                           663459538.7
                   After the manual editing is complete, the final steps of the LRI chain need to be run manually. The script /fosds/work/L1B/rl00/2021/2021-01-09/LRI1B/test/process_LRI_2.sh does this for the rl00 data. For rl04 processing, this can be copied and modified as necessary.
                   Note: LRI1B (as well as KBR1B - since LRI1B and KBR1B are the same format) data comparisons can be done with the code ~cmccullo/bin/compareKbr.py
  spacecraft: C
