- problem_files: comment
  time: '2021-01-08 00:00:00'
  gps_time: 663336000.0
  created: ''
  createdby: ''
  data: |2
               The LRI experienced anomalous behavior during blinding events that necessitated special handling of the LRI processing. This is fully outlined below:
               Editing of the LRI1A for GF2:
                   Data before the gaps induced by sun blinding had to be edited further to avoid corrupted data. Note that these spans are probably over-edited.
                   Remove data points from the following times (inclusive):
                       663391436.049999183 - 663391447.121792207
                       663397106.034085394 - 663397119.692745947
                       663402776.017193770 - 663402792.469671255
                       663408451.058769491 - 663408464.613955343
                   Note that after the break (due to the sun blinding, the extra editing above, and the anomalous data), qualflag 0 must be set to 1, in order to indicate that the gap should not be filled. Currently, if the gap is 21 seconds or longer, this is done automatically by LRI_debreak. In this case the gaps are longer than 21 seconds so no extra action is needed. In the future, if the gaps were smaller the option -maxgap (to LRI_debreak) could be used to set the qualflag 0 to 1.
                   After the manual editing is complete, the initial steps of the LRI chain need to be run manually. The script /fosds/work/L1B/rl00/2021/2021-01-08/LRI1B/test/process_LRI_1.sh does this for the rl00 data. For rl04 processing, this script can be copied and modified as necessary.
                   Additionally there is currently a bug in the LRI chain that does NOT propagate the setting of qualflag 0 to 1 all the way through the LRI process to the second run of LRI_order (see the wiki - Notes for operators - for details on the LRI processing chain). Due to this, manual edits have to be made in the LRI1A_2021-01-08_D_00.dat.dbk.jmp.llkOrd file. These are outlined below:
                   Edits needed on the LRI1A_2021-01-08_D_00.dat.dbk.jmp.llkOrd file:
                       Change qualflag 0 to 1 (example: 00000000 -> 00000001) for the following times (these are just after the gap (due to sun blinding and extra editing of the LRI1A file):
                           663391460.6
                           66339713e.7
                           663402806.6
                           663408478.7
                   After the manual editing is complete, the final steps of the LRI chain need to be run manually. The script /fosds/work/L1B/rl00/2021/2021-01-08/LRI1B/test/process_LRI_2.sh does this for the rl00 data. For rl04 processing, this can be copied and modified as necessary.
                   Note: LRI1B (as well as KBR1B - since LRI1B and KBR1B are the same format) data comparisons can be done with the code ~cmccullo/bin/compareKbr.py
  spacecraft: C
- spacecraft_event: comment
  time: '2021-01-09 00:00:00'
  gps_time: 663422400.0
  created: ''
  createdby: ''
  data: |2
               GRACE-D Anomalous behavior of the LRI during sun blindings necessitated some special handling of the LRI data.
                       Note that the span from 10:08 to 10:18, may have a suspect time bias value (this data may have to be edited at Level-2). - cmccullo
  spacecraft: C
- problem_files: comment
  time: '2021-01-11 00:00:00'
  gps_time: 663595200.0
  created: ''
  createdby: ''
  data: |2
               A time jump in the IPU automatically disabled PPS synchronization between the IPU and OBC (due to a modified FDIR repsonse to such events). Therefore, the OBC is not synched to the IPU from 2021-01-11 16:31:43 to 2021-01-12 09:16 (when time synch was commanded to be re-enabled) and is allowed to drift freely. Due to the OBC drift the LRI datation values are not valid until after 2021-01-12 09:16. Therefore, the LRI datation value associated with the IPU reboot at 2021-01-11 17:04:00 was manually determined from LRI datation reports after the time synch. Additionally, any accurate LRI datation value associated with the IPU reboot at 2021-01-11 16:48:50 is unknown. - cmccullo
  spacecraft: C
- spacecraft_event: comment
  time: '2021-01-11 00:00:00'
  gps_time: 663595200.0
  created: ''
  createdby: ''
  data: |2
               GRACE-C The last part of the LRI diagnostic data collection (01/11-Jan) was finished at 12:31. - mpaik
               GRACE-D The IPU PPS time incorrectly jumped by 1024 sec (similar to the time jump on 18-Jan-2020). Thanks to the modified FDIR response to such an event the on-board time synchronization to GPS was disabled and the satellite maintained the NOM-FP mode. As a result of the time jump, the IPU was unable to acquire new GPS satellites and it rebooted at 16:48 (south-east Indian Ocean). A short time later, it rebooted again at 17:03 (Laos).
               GRACE-D IPU reboot (spontaneous) at 16:48:50
               GRACE-D IPU reboot (spontaneous) at 17:04:00 - mpaik
  spacecraft: C
- spacecraft_event: comment
  time: '2021-01-12 00:00:00'
