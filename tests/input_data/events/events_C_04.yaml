  data: "           and 2024-01-24 Meegyeong’s prompting this morning made me notice\
    \ that channel 28 seemed to go bad on GraceFo-C at 2024-01-16  05:49:00 GPS (\
    \ +- 60 seconds).     However, the “badness” is of a different character than\
    \ we’ve seen before.    Like times we’ve seen before, the SNR of the “bad” L1\
    \ Channel (channel 28 in this case) stays unnaturally low. However, the phase\
    \ residuals to the POD don’t seem to change much (they change character a bit),\
    \ but it is the range residuals that go crazy.    The phase lock breaks on channel\
    \ 28 more often than other channels after it goes “bad”, which is not apparent\
    \ from the POD phase residual plots (though it does look like the phase residuals\
    \ get rattier after it goes “bad”). -Mark\n           Removed GF1 GPS data of\
    \ a bad channel 28 from 758656140 (2024-01-16 05:49:00) to 759378472 (2024-01-24\
    \ 14:27:52). - mpaik     \n"
  spacecraft: C
