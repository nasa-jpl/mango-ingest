  time: '2024-08-09 00:00:00'
  gps_time: 776433600.0
  created: ''
  createdby: ''
  data: |2
               This was a fun one! The root cause was a half-cycle slip, on both L1 and L2, in the same direction, over 2 seconds (for graceFo-D with GPS67). This on a day where the ionosphere L1P-L2P is routinely getting jerked around at the 2 cm/sec level! This would cause night terrors for anyone in the continuity editing business. If you put a phase break on GraceFo-D / GPS67 phase data at epoch j2k=776447470 (GPS time 2024-08-09 03:51:10) and reprocess the POD, the KBR residual spike goes away. The edited data that I used is at /home/mamiller/GraceFo/rl04/D_2024-08-09_try3/new_dataRecord.dr.gz  (the POD re-run is in that same directory). - Mark
               I copied Mark's dataRecord.dr.gz to /fosds/work/od_working/rl04/D_2024-08-09 and re-ran the POD and L1B procedures. AFTERWARD, I inserted a phase break at 776447470 in GPS1A.edit for channels 33, 34, 35 in the working directory of GPS1B_D. In this case, GPS67 was identified with channels 33, 34, 36 using dataRecord.dr.gz. I then re-ran GPS1B_D. According to Willy, we don't need to correct GPI1A in this case. - mpaik
  spacecraft: C
