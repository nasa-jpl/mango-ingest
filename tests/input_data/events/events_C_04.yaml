  data: "           GRACE-C At 22:57 a mode transition to ASM occurred. OBCP_14 was\
    \ executed and all instruments (except USO and ACC) were switched-off.\n     \
    \              It was caused by accidentally uplinking a command which disabled\
    \ the attitude control thrusters.\n                   Recovery actions were executed:\n\
    \                   At 23:48 the attitude control thrusters were re-enabled.\n\
    \                   At 07:51 the thermal loops of IPU-B, MWA-B, LRI and ACC were\
    \ configured for instrument operations.\n                   At 09:16 STRE-A was\
    \ switched on.\n                   At 09:20 the mode transition to NOM-FP was\
    \ performed.\n                   At 10:13 IPU-B was switched on (over Antarctica).\n\
    \                   At 11:08 the synchronization of the on-board time with GPS\
    \ was activated.\n                   At 11:30 the pointing frame was switched\
    \ from nadir to relative pointing.\n                   At 12:37 MWA-B was switched\
    \ on.\n                   At 14:10 LRI was switched on. \n                   IPU\
    \ S/W was successfully updated to version V4.3: \n                   At 11:51\
    \ FlashFileLib was uploaded and installed.\n                   At 13:23 IPU-B\
    \ was restarted and the new S/W was activated (over Antarctica).\n"
  spacecraft: C
