[loggers]
keys=root

[handlers]
keys=stdout

[formatters]
keys=basicformatter

[logger_root]
level=INFO
handlers=stdout

[formatter_basicformatter]
format=[%(asctime)s.%(msecs)03d] %(levelname)s [%(thread)d] - %(message)s

[handler_stdout]
class=StreamHandler
level=INFO
formatter=basicformatter
args=(sys.stdout,)
