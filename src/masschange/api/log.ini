[loggers]
keys=root

[handlers]
keys=stdout,logfile

[formatters]
keys=basicformatter

[logger_root]
level=INFO
handlers=stdout,logfile

[formatter_basicformatter]
format=[%(asctime)s.%(msecs)03d] %(levelname)s [%(thread)d] - %(message)s

[handler_stdout]
class=StreamHandler
level=INFO
formatter=basicformatter
args=(sys.stdout,)

[handler_logfile]
class=handlers.RotatingFileHandler
level=INFO
args=('/logs/api/latest.log','a')
formatter=basicformatter